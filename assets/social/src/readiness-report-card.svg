<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="1200" height="990" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bar-yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="bar-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="660" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="658" rx="15" fill="none" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Terminal dots -->
  <circle cx="32" cy="28" r="8" fill="#ff5f57"/>
  <circle cx="56" cy="28" r="8" fill="#febc2e"/>
  <circle cx="80" cy="28" r="8" fill="#28c840"/>

  <!-- Divider -->
  <line x1="24" y1="52" x2="776" y2="52" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="92" fill="#a78bfa" font-size="22" font-weight="bold">$</text>
  <text x="62" y="92" fill="#e2e8f0" font-size="22"> /readiness</text>

  <!-- Project info -->
  <text x="40" y="132" fill="#6b7280" font-size="18">Project:</text>
  <text x="138" y="132" fill="#e2e8f0" font-size="18">my-project (Node.js / TypeScript)</text>

  <!-- Level badge -->
  <rect x="40" y="152" width="180" height="42" rx="8" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="130" y="180" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="bold">Level 3 / 5</text>

  <!-- Score -->
  <rect x="234" y="152" width="180" height="42" rx="8" fill="#1e1e3a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="252" y="180" fill="#e2e8f0" font-size="20">Score:</text>
  <text x="330" y="180" fill="#4ade80" font-size="20" font-weight="bold">28 / 36</text>

  <!-- Divider -->
  <line x1="40" y1="216" x2="760" y2="216" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Pillar header -->
  <text x="40" y="250" fill="#6b7280" font-size="16" letter-spacing="2">PILLAR SCORES</text>

  <!-- Pillar 1: Style & Validation - 4/4 (100%) -->
  <text x="40" y="294" fill="#94a3b8" font-size="18">Style &amp; Validation</text>
  <rect x="280" y="278" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="278" width="400" height="22" rx="4" fill="url(#bar-green)" opacity="0.9"/>
  <text x="694" y="295" fill="#4ade80" font-size="18" font-weight="bold">4/4</text>

  <!-- Pillar 2: Testing - 4/5 (80%) -->
  <text x="40" y="338" fill="#94a3b8" font-size="18">Testing</text>
  <rect x="280" y="322" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="322" width="320" height="22" rx="4" fill="url(#bar-green)" opacity="0.9"/>
  <text x="694" y="339" fill="#4ade80" font-size="18" font-weight="bold">4/5</text>

  <!-- Pillar 3: Git Hooks - 5/5 (100%) -->
  <text x="40" y="382" fill="#94a3b8" font-size="18">Git Hooks</text>
  <rect x="280" y="366" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="366" width="400" height="22" rx="4" fill="url(#bar-green)" opacity="0.9"/>
  <text x="694" y="383" fill="#4ade80" font-size="18" font-weight="bold">5/5</text>

  <!-- Pillar 4: Documentation - 6/9 (67%) -->
  <text x="40" y="426" fill="#94a3b8" font-size="18">Documentation</text>
  <rect x="280" y="410" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="410" width="267" height="22" rx="4" fill="url(#bar-yellow)" opacity="0.9"/>
  <text x="694" y="427" fill="#facc15" font-size="18" font-weight="bold">6/9</text>

  <!-- Pillar 5: Agent Config - 3/5 (60%) -->
  <text x="40" y="470" fill="#94a3b8" font-size="18">Agent Configuration</text>
  <rect x="280" y="454" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="454" width="240" height="22" rx="4" fill="url(#bar-yellow)" opacity="0.9"/>
  <text x="694" y="471" fill="#facc15" font-size="18" font-weight="bold">3/5</text>

  <!-- Pillar 6: Code Quality - 3/3 (100%) -->
  <text x="40" y="514" fill="#94a3b8" font-size="18">Code Quality</text>
  <rect x="280" y="498" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="498" width="400" height="22" rx="4" fill="url(#bar-green)" opacity="0.9"/>
  <text x="694" y="515" fill="#4ade80" font-size="18" font-weight="bold">3/3</text>

  <!-- Pillar 7: Dev Environment - 3/3 (100%) -->
  <text x="40" y="558" fill="#94a3b8" font-size="18">Dev Environment</text>
  <rect x="280" y="542" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <rect x="280" y="542" width="400" height="22" rx="4" fill="url(#bar-green)" opacity="0.9"/>
  <text x="694" y="559" fill="#4ade80" font-size="18" font-weight="bold">3/3</text>

  <!-- Pillar 8: Agentic Workflow - 0/2 (0%) -->
  <text x="40" y="602" fill="#94a3b8" font-size="18">Agentic Workflow</text>
  <rect x="280" y="586" width="400" height="22" rx="4" fill="#1e1e3a"/>
  <text x="694" y="603" fill="#ef4444" font-size="18" font-weight="bold">0/2</text>

  <!-- Bottom divider -->
  <line x1="40" y1="636" x2="760" y2="636" stroke="#2a2a4a" stroke-width="1"/>
</svg>
